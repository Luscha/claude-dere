name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate style structure
        run: ./validate.sh
      - name: Installer smoke test
        run: |
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" ./install.sh
          expected=$(ls styles/*.md | wc -l)
          actual=$(ls "$RUNNER_TEMP/claude/output-styles" | wc -l)
          echo "styles/: $expected   installed: $actual"
          test "$actual" -eq "$expected"

      - name: Every style has an examples page
        run: |
          for f in styles/*.md; do
            e="examples/$(basename "$f")"
            test -f "$e" || { echo "missing $e"; exit 1; }
          done
